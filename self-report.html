<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Pulse — Mangalam</title>
<style>
  :root {
    --navy: #1A3F6F; --green: #2E7D5B; --bg: #F5F6FA; --card: #fff;
    --text: #1F2937; --text-soft: #6B7280; --border: #E5E7EB; --red:#B0413E;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }
  .header { text-align:center; margin-bottom: 24px; }
  .header h1 { font-size: 20px; color: var(--navy); margin: 0 0 6px; }
  .header p { font-size: 13px; color: var(--text-soft); margin: 0; }
  .card { background: var(--card); border-radius: 14px; padding: 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .identity-card { display:flex; align-items:center; gap: 12px; }
  .identity-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex-shrink:0; }
  .identity-name { font-size: 16px; font-weight: 700; }
  .identity-dept { font-size: 12px; color: var(--text-soft); }
  label { display:block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  input[type=email], textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; font-family: inherit; margin-bottom: 0; background: #fafbfc;
  }
  textarea { min-height: 70px; resize: vertical; }
  .email-row { display:flex; gap: 8px; }
  .email-row input { flex:1; }
  .email-row button {
    padding: 0 18px; border-radius: 8px; border:none; background: var(--navy); color:#fff;
    font-size: 13px; font-weight:700; cursor:pointer;
  }
  .email-row button:disabled { background:#ccc; cursor:not-allowed; }
  .field-error { color: var(--red); font-size: 12px; margin-top: 8px; }
  .scale-row { display:flex; gap:6px; margin-bottom: 18px; margin-top: 14px; }
  .scale-btn {
    flex:1; padding: 10px 0; border-radius: 8px; border: 1px solid var(--border);
    background: #fafbfc; font-size: 13px; font-weight: 600; cursor:pointer; color: var(--text-soft);
  }
  .scale-btn.selected { background: var(--navy); color:#fff; border-color: var(--navy); }
  .scale-labels { display:flex; justify-content: space-between; font-size: 11px; color: var(--text-soft); margin-bottom: 18px; margin-top:-12px; }
  .submit-btn {
    width:100%; padding: 14px; border-radius: 10px; border:none; background: var(--green);
    color:#fff; font-size: 15px; font-weight: 700; cursor:pointer; margin-top: 8px;
  }
  .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
  .confirm { text-align:center; padding: 50px 20px; }
  .confirm h2 { color: var(--green); }
  .privacy-note { font-size: 11.5px; color: var(--text-soft); text-align:center; margin-top: 14px; line-height: 1.5; }
  .closed-box { text-align:center; padding: 50px 20px; }
  .closed-box h2 { color: var(--red); font-size: 18px; margin-bottom: 10px; }
  .closed-box p { color: var(--text-soft); font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap" id="formWrap">
  <div class="header">
    <h1>Monthly Pulse Check</h1>
    <p>Mangalam · Confidential, viewed only by HR & CEO</p>
  </div>
  <div id="content"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBdAUB51RSVveZfAwRN0UMuHYKWtOurQrx0HptQe-KftLh0jcikCaeM5He1-GEomhw/exec';
var ACCESS_TOKEN = 'e6a7c4f500c089c9fc85f33f1657b49bf20f58ba054ffd53';

var answers = { workload: null, managerSupport: null, growth: null, recognition: null, workEnvironment: null, compensation: null, enps: null, retentionIntent: null, wellbeingTrend: null };
var currentEmployee = null;

function initials(name) {
  return name.split(' ').map(function(p){ return p[0]; }).join('').substring(0,2).toUpperCase();
}

function renderClosed() {
  document.getElementById('content').innerHTML =
    '<div class="card closed-box"><h2>Happiness review of this month is closed</h2>' +
    '<p>From July 2026 onward, the monthly pulse check is open only on the 1st and 2nd of each month. ' +
    'Please come back during that window next month.</p></div>';
}

function renderEmailGate() {
  var html = '';
  html += '<div class="card">';
  html += '<label for="emailInput">Enter your registered email</label>';
  html += '<div class="email-row"><input type="email" id="emailInput" placeholder="you@example.com"><button id="verifyBtn">Continue</button></div>';
  html += '<div class="field-error" id="emailError"></div>';
  html += '</div>';
  document.getElementById('content').innerHTML = html;

  document.getElementById('verifyBtn').addEventListener('click', verifyEmail);
  document.getElementById('emailInput').addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter') verifyEmail();
  });
}

function verifyEmail() {
  var email = document.getElementById('emailInput').value.trim();
  var errBox = document.getElementById('emailError');
  errBox.textContent = '';
  if (!email) { errBox.textContent = 'Please enter your email.'; return; }

  var btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.textContent = 'Checking…';

  fetch(APPS_SCRIPT_URL + '?action=lookupEmployee&email=' + encodeURIComponent(email) + '&token=' + encodeURIComponent(ACCESS_TOKEN))
    .then(function(r) { return r.json(); })
    .then(function(res) {
      btn.disabled = false;
      btn.textContent = 'Continue';
      if (!res.found) {
        errBox.textContent = res.error || 'Email not recognized.';
        return;
      }
      renderForm(res.employee);
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Continue';
      errBox.textContent = 'Could not verify right now. Please try again.';
    });
}

function renderForm(emp) {
  currentEmployee = emp;
  var html = '';

  html += '<div class="card identity-card">';
  html += '<div class="identity-avatar">' + initials(emp.Name) + '</div>';
  html += '<div><div class="identity-name">' + emp.Name + '</div><div class="identity-dept">' + emp.Department + ' · ' + emp.Designation + '</div></div>';
  html += '</div>';

  html += '<div class="card">';
  var questions = [
    ['workload', 'How manageable is your current workload?', 'Overwhelming', 'Very manageable'],
    ['managerSupport', 'How supported do you feel by your manager?', 'Not supported', 'Fully supported'],
    ['growth', 'How much are you growing / learning in this role?', 'Stagnant', 'Growing fast'],
    ['recognition', 'Do you feel recognized for your work?', 'Unrecognized', 'Well recognized'],
    ['workEnvironment', 'How is your day-to-day work environment?', 'Poor', 'Excellent'],
    ['compensation', 'How fairly do you feel compensated?', 'Unfair', 'Very fair'],
    ['enps', 'How likely are you to recommend Mangalam as a place to work?', 'Not at all', 'Extremely likely'],
    ['retentionIntent', 'How likely are you to still be working here a year from now?', 'Very unlikely', 'Very likely'],
    ['wellbeingTrend', 'Compared to last month, how is your overall wellbeing at work?', 'Much worse', 'Much better']
  ];
  questions.forEach(function(q) {
    html += '<label>' + q[1] + '</label>';
    html += '<div class="scale-row" data-q="' + q[0] + '"></div>';
    html += '<div class="scale-labels"><span>' + q[2] + '</span><span>' + q[3] + '</span></div>';
  });
  html += '</div>';

  html += '<div class="card">';
  html += '<label>What is one innovation that you think the organization or your department should adopt to achieve Mangalam' + "'" + 's mission? (optional)</label>';
  html += '<textarea id="innovationIdea" placeholder="Describe the idea…"></textarea>';
  html += '<label style="margin-top:14px;">Why do you think this would help? (optional)</label>';
  html += '<textarea id="innovationReasoning" placeholder="Explain the reasoning / expected impact…"></textarea>';
  html += '</div>';

  html += '<div class="card"><label>Anything you' + "'" + 'd like to share? (optional)</label><textarea id="comments" placeholder="Open feedback, concerns, suggestions…"></textarea></div>';

  html += '<button class="submit-btn" id="submitBtn" disabled>Submit Pulse Check</button>';
  html += '<div class="privacy-note">Your individual responses are visible only to HR and the CEO — not to peers, and not shown back to managers under your name. Be honest; this is how things actually improve.</div>';

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('.scale-row').forEach(function(row) {
    buildScaleRow(row, row.getAttribute('data-q'));
  });
  document.getElementById('submitBtn').addEventListener('click', submitForm);
}

function buildScaleRow(container, q) {
  for (var i = 1; i <= 10; i++) {
    var btn = document.createElement('button');
    btn.className = 'scale-btn';
    btn.type = 'button';
    btn.textContent = i;
    btn.addEventListener('click', function(val, q) {
      return function() {
        answers[q] = val;
        var row = document.querySelector('.scale-row[data-q="' + q + '"]');
        Array.prototype.forEach.call(row.children, function(c) { c.classList.remove('selected'); });
        this.classList.add('selected');
        checkComplete();
      };
    }(i, q));
    container.appendChild(btn);
  }
}

function checkComplete() {
  var allAnswered = Object.keys(answers).every(function(k) { return answers[k] !== null; });
  document.getElementById('submitBtn').disabled = !allAnswered;
}

function submitForm() {
  var payload = {
    action: 'submitSelfReport',
    token: ACCESS_TOKEN,
    employeeId: currentEmployee.ID,
    employeeName: currentEmployee.Name,
    department: currentEmployee.Department,
    workload: answers.workload,
    managerSupport: answers.managerSupport,
    growth: answers.growth,
    recognition: answers.recognition,
    workEnvironment: answers.workEnvironment,
    compensation: answers.compensation,
    enps: answers.enps,
    retentionIntent: answers.retentionIntent,
    wellbeingTrend: answers.wellbeingTrend,
    innovationIdea: document.getElementById('innovationIdea').value,
    innovationReasoning: document.getElementById('innovationReasoning').value,
    comments: document.getElementById('comments').value
  };

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.success) {
      document.getElementById('content').innerHTML = '<div class="card"><div class="confirm"><h2>Thank you ✓</h2><p>Your pulse check has been recorded confidentially.</p></div></div>';
    } else {
      alert(res.error || res.message || 'Submission failed. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Submit Pulse Check';
    }
  })
  .catch(function(err) {
    alert('Network error: ' + err);
    btn.disabled = false;
    btn.textContent = 'Submit Pulse Check';
  });
}

// ── Boot sequence ────────────────────────────────────────────────
document.getElementById('content').innerHTML = '<div class="card"><p style="text-align:center;color:var(--text-soft);font-size:13px;">Loading…</p></div>';
fetch(APPS_SCRIPT_URL + '?action=windowStatus&token=' + encodeURIComponent(ACCESS_TOKEN))
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (!res.open) {
      renderClosed();
    } else {
      renderEmailGate();
    }
  })
  .catch(function() {
    // If the status check itself fails, fall through to the email gate —
    // the backend will still enforce the window on actual submit.
    renderEmailGate();
  });
</script>
</body>
</html>
