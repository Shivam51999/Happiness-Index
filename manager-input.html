<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Pulse — Manager Input · Mangalam</title>
<style>
  :root {
    --navy: #1A3F6F; --brown: #A0522D; --bg: #F5F6FA; --card: #fff;
    --text: #1F2937; --text-soft: #6B7280; --border: #E5E7EB; --red:#B0413E;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }
  .header { text-align:center; margin-bottom: 24px; }
  .header h1 { font-size: 20px; color: var(--navy); margin: 0 0 6px; }
  .header p { font-size: 13px; color: var(--text-soft); margin: 0; }
  .card { background: var(--card); border-radius: 14px; padding: 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .identity-card { display:flex; align-items:center; gap: 12px; }
  .identity-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--brown); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex-shrink:0; }
  .identity-name { font-size: 16px; font-weight: 700; }
  .identity-sub { font-size: 12px; color: var(--text-soft); }
  label { display:block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  select, textarea, input[type=email] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; font-family: inherit; margin-bottom: 0; background: #fafbfc;
  }
  textarea { min-height: 60px; resize: vertical; margin-top: 14px; }
  .email-row { display:flex; gap: 8px; }
  .email-row input { flex:1; }
  .email-row button {
    padding: 0 18px; border-radius: 8px; border:none; background: var(--navy); color:#fff;
    font-size: 13px; font-weight:700; cursor:pointer;
  }
  .email-row button:disabled { background:#ccc; cursor:not-allowed; }
  .field-error { color: var(--red); font-size: 12px; margin-top: 8px; }
  .scale-row { display:flex; gap:6px; margin-bottom: 18px; margin-top: 14px; }
  .scale-btn {
    flex:1; padding: 10px 0; border-radius: 8px; border: 1px solid var(--border);
    background: #fafbfc; font-size: 13px; font-weight: 600; cursor:pointer; color: var(--text-soft);
  }
  .scale-btn.selected { background: var(--brown); color:#fff; border-color: var(--brown); }
  .scale-labels { display:flex; justify-content: space-between; font-size: 11px; color: var(--text-soft); margin-bottom: 18px; margin-top:-12px; }
  .flag-row { display:flex; flex-direction: column; gap: 10px; margin-bottom: 16px; margin-top: 14px; }
  .flag-item { display:flex; align-items:center; gap: 10px; padding: 10px 12px; border-radius:8px; border:1px solid var(--border); background:#fafbfc; cursor:pointer; }
  .flag-item input { width: 16px; height: 16px; }
  .flag-item span { font-size: 13px; }
  .submit-btn {
    width:100%; padding: 14px; border-radius: 10px; border:none; background: var(--navy);
    color:#fff; font-size: 15px; font-weight: 700; cursor:pointer; margin-top: 8px;
  }
  .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
  .confirm { text-align:center; padding: 50px 20px; }
  .confirm h2 { color: var(--navy); }
  .closed-box { text-align:center; padding: 50px 20px; }
  .closed-box h2 { color: var(--red); font-size: 18px; margin-bottom: 10px; }
  .closed-box p { color: var(--text-soft); font-size: 13px; line-height: 1.5; }
  .progress-note { font-size: 12px; color: var(--text-soft); text-align:center; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap" id="formWrap">
  <div class="header">
    <h1>Team Pulse — Manager Input</h1>
    <p>Your perception of each team member's current satisfaction</p>
  </div>
  <div id="content"></div>
</div>

<script>
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBdAUB51RSVveZfAwRN0UMuHYKWtOurQrx0HptQe-KftLh0jcikCaeM5He1-GEomhw/exec';
var ACCESS_TOKEN = 'e6a7c4f500c089c9fc85f33f1657b49bf20f58ba054ffd53';

var scores = { perceived: null, retentionConfidence: null };
var team = [];
var submittedIds = [];
var currentManagerName = '';

function initials(name) {
  return name.split(' ').map(function(p){ return p[0]; }).join('').substring(0,2).toUpperCase();
}

function renderClosed() {
  document.getElementById('content').innerHTML =
    '<div class="card closed-box"><h2>Happiness review of this month is closed</h2>' +
    '<p>From July 2026 onward, the monthly pulse check is open only on the 1st and 2nd of each month. ' +
    'Please come back during that window next month.</p></div>';
}

function renderEmailGate() {
  var html = '';
  html += '<div class="card">';
  html += '<label for="emailInput">Enter your registered email</label>';
  html += '<div class="email-row"><input type="email" id="emailInput" placeholder="you@example.com"><button id="verifyBtn">Continue</button></div>';
  html += '<div class="field-error" id="emailError"></div>';
  html += '</div>';
  document.getElementById('content').innerHTML = html;

  document.getElementById('verifyBtn').addEventListener('click', verifyEmail);
  document.getElementById('emailInput').addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter') verifyEmail();
  });
}

function verifyEmail() {
  var email = document.getElementById('emailInput').value.trim();
  var errBox = document.getElementById('emailError');
  errBox.textContent = '';
  if (!email) { errBox.textContent = 'Please enter your email.'; return; }

  var btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.textContent = 'Checking…';

  fetch(APPS_SCRIPT_URL + '?action=lookupManager&email=' + encodeURIComponent(email) + '&token=' + encodeURIComponent(ACCESS_TOKEN))
    .then(function(r) { return r.json(); })
    .then(function(res) {
      btn.disabled = false;
      btn.textContent = 'Continue';
      if (!res.found) {
        errBox.textContent = res.error || 'Email not recognized.';
        return;
      }
      currentManagerName = res.manager.Name;
      team = res.team;
      renderForm();
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Continue';
      errBox.textContent = 'Could not verify right now. Please try again.';
    });
}

function renderForm() {
  var html = '';
  html += '<div class="card identity-card">';
  html += '<div class="identity-avatar">' + initials(currentManagerName) + '</div>';
  html += '<div><div class="identity-name">' + currentManagerName + '</div><div class="identity-sub">Rating ' + team.length + ' team member(s)</div></div>';
  html += '</div>';

  html += '<div class="progress-note" id="progressNote"></div>';

  html += '<div class="card">';
  html += '<label for="empSelect">Team member</label>';
  html += '<select id="empSelect"><option value="">Select team member…</option></select>';

  html += '<label style="margin-top:14px;">How satisfied do you believe this person currently is?</label>';
  html += '<div class="scale-row" id="scoreRow"></div>';
  html += '<div class="scale-labels"><span>Very dissatisfied</span><span>Very satisfied</span></div>';

  html += '<label>How confident are you this person stays for the next 6 months?</label>';
  html += '<div class="scale-row" id="retentionRow"></div>';
  html += '<div class="scale-labels"><span>Not confident</span><span>Very confident</span></div>';

  html += '<label>Flags (check any that apply)</label>';
  html += '<div class="flag-row">';
  html += '<label class="flag-item"><input type="checkbox" id="flagRisk"><span>At risk of leaving in next 3 months</span></label>';
  html += '<label class="flag-item"><input type="checkbox" id="flagOverload"><span>Currently overloaded / burning out</span></label>';
  html += '<label class="flag-item"><input type="checkbox" id="flagRecognition"><span>Due for recognition — doing great, underacknowledged</span></label>';
  html += '<label class="flag-item"><input type="checkbox" id="flagPersonal"><span>Personal reasons may be affecting their work</span></label>';
  html += '</div>';

  html += '<label>Notes (optional, kept confidential to HR/CEO)</label>';
  html += '<textarea id="notes" placeholder="Any context worth flagging…"></textarea>';
  html += '</div>';

  html += '<button class="submit-btn" id="submitBtn" disabled>Submit</button>';

  document.getElementById('content').innerHTML = html;

  var sel = document.getElementById('empSelect');
  team.forEach(function(emp) {
    var opt = document.createElement('option');
    opt.value = emp.ID;
    opt.textContent = emp.Name;
    opt.dataset.dept = emp.Department;
    opt.dataset.name = emp.Name;
    sel.appendChild(opt);
  });

  buildScoreRow();
  buildRetentionRow();
  updateProgress();

  sel.addEventListener('change', checkComplete);
  document.getElementById('submitBtn').addEventListener('click', submitOne);
}

function buildScoreRow() {
  var row = document.getElementById('scoreRow');
  for (var i = 1; i <= 10; i++) {
    var btn = document.createElement('button');
    btn.className = 'scale-btn';
    btn.type = 'button';
    btn.textContent = i;
    btn.addEventListener('click', function(val) {
      return function() {
        scores.perceived = val;
        Array.prototype.forEach.call(row.children, function(c) { c.classList.remove('selected'); });
        this.classList.add('selected');
        checkComplete();
      };
    }(i));
    row.appendChild(btn);
  }
}

function buildRetentionRow() {
  var row = document.getElementById('retentionRow');
  for (var i = 1; i <= 10; i++) {
    var btn = document.createElement('button');
    btn.className = 'scale-btn';
    btn.type = 'button';
    btn.textContent = i;
    btn.addEventListener('click', function(val) {
      return function() {
        scores.retentionConfidence = val;
        Array.prototype.forEach.call(row.children, function(c) { c.classList.remove('selected'); });
        this.classList.add('selected');
        checkComplete();
      };
    }(i));
    row.appendChild(btn);
  }
}

function updateProgress() {
  document.getElementById('progressNote').textContent =
    submittedIds.length + ' of ' + team.length + ' team members rated this month';
}

function checkComplete() {
  var ok = document.getElementById('empSelect').value && scores.perceived !== null && scores.retentionConfidence !== null;
  document.getElementById('submitBtn').disabled = !ok;
}

function resetForNext() {
  scores.perceived = null;
  scores.retentionConfidence = null;
  document.querySelectorAll('#scoreRow .scale-btn').forEach(function(b){ b.classList.remove('selected'); });
  document.querySelectorAll('#retentionRow .scale-btn').forEach(function(b){ b.classList.remove('selected'); });
  document.getElementById('flagRisk').checked = false;
  document.getElementById('flagOverload').checked = false;
  document.getElementById('flagRecognition').checked = false;
  document.getElementById('flagPersonal').checked = false;
  document.getElementById('notes').value = '';
  var sel = document.getElementById('empSelect');
  Array.prototype.slice.call(sel.options).forEach(function(opt) {
    if (submittedIds.indexOf(opt.value) > -1) opt.remove();
  });
  sel.value = '';
  checkComplete();
  updateProgress();

  if (team.length > 0 && submittedIds.length >= team.length) {
    document.getElementById('content').innerHTML = '<div class="card"><div class="confirm"><h2>All done ✓</h2><p>You' + "'" + 've rated your whole team for this month. Thank you.</p></div></div>';
  }
}

function submitOne() {
  var sel = document.getElementById('empSelect');
  var opt = sel.options[sel.selectedIndex];
  var payload = {
    action: 'submitManagerInput',
    token: ACCESS_TOKEN,
    employeeId: sel.value,
    employeeName: opt.dataset.name,
    department: opt.dataset.dept,
    managerName: currentManagerName,
    perceivedScore: scores.perceived,
    retentionConfidence: scores.retentionConfidence,
    attritionRisk: document.getElementById('flagRisk').checked,
    overload: document.getElementById('flagOverload').checked,
    needsRecognition: document.getElementById('flagRecognition').checked,
    personalReasons: document.getElementById('flagPersonal').checked,
    notes: document.getElementById('notes').value
  };

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    btn.textContent = 'Submit';
    if (res.success) {
      submittedIds.push(payload.employeeId);
      resetForNext();
    } else {
      alert(res.error || res.message || 'Submission failed.');
      btn.disabled = false;
    }
  })
  .catch(function(err) {
    alert('Network error: ' + err);
    btn.disabled = false;
    btn.textContent = 'Submit';
  });
}

// ── Boot sequence ────────────────────────────────────────────────
document.getElementById('content').innerHTML = '<div class="card"><p style="text-align:center;color:var(--text-soft);font-size:13px;">Loading…</p></div>';
fetch(APPS_SCRIPT_URL + '?action=windowStatus&token=' + encodeURIComponent(ACCESS_TOKEN))
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (!res.open) {
      renderClosed();
    } else {
      renderEmailGate();
    }
  })
  .catch(function() {
    renderEmailGate();
  });
</script>
</body>
</html>
